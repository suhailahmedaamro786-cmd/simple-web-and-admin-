<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SK Store Admin</title><link rel="stylesheet" href="/styles.css"></head><body><div class="topbar">PRIVATE STORE MANAGEMENT</div><header class="header"><a class="brand" href="/">SK<span>STORE</span></a><nav><a href="/">View storefront ↗</a></nav><button id="logout" class="cart-button" hidden>Log out</button></header><main class="admin-main"><section id="login-view" class="login-wrap"><span class="eyebrow">ADMIN ACCESS</span><h1>Welcome back</h1><p>Sign in to manage products, inventory and customer orders.</p><form id="login-form" class="admin-form"><label>Password<input name="password" type="password" required autocomplete="current-password"></label><button class="primary wide">Sign in</button><p id="login-message"></p></form></section><section id="dashboard" hidden><div class="section-head"><div><span class="eyebrow">STORE CONTROL</span><h2>Dashboard</h2></div><button id="refresh" class="cart-button">Refresh data</button></div><div class="admin-tabs"><button class="category active" data-tab="products-tab">Products</button><button class="category" data-tab="orders-tab">Orders</button></div><section id="products-tab" class="admin-panel"><div class="section-head"><h2>Products</h2><button id="new-product" class="primary">+ Add product</button></div><form id="product-form" class="admin-form" hidden><input type="hidden" name="id"><div class="form-grid"><label>Product name<input name="name" required maxlength="120"></label><label>SKU<input name="sku" maxlength="60"></label><label>Category<select name="category_id" id="product-category"></select></label><label>Price (PKR)<input name="price" type="number" min="0" required></label><label>Compare price<input name="compare_price" type="number" min="0"></label><label>Stock quantity<input name="stock" type="number" min="0" value="0"></label><label class="wide-field">Image URL<input name="image_url" type="url"></label><label class="wide-field">Description<textarea name="description" rows="2"></textarea></label></div><div class="admin-actions"><button class="primary">Save product</button><button type="button" id="cancel-product" class="cart-button">Cancel</button></div><p id="product-message"></p></form><div id="admin-products" class="admin-table"></div></section><section id="orders-tab" class="admin-panel" hidden><div class="section-head"><h2>Customer orders</h2></div><div id="admin-orders" class="admin-table"></div></section></section></main><footer><a class="brand" href="/">SK<span>STORE</span></a><small>Private dashboard · SK Dev Team</small></footer><script src="/admin.js"></script></body></html>
