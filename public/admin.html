<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin · SK Store</title><link rel="stylesheet" href="/styles.css"></head>
<body class="admin-body"><header class="site-header"><a class="brand" href="/">SK<span>STORE</span></a><a class="admin-link" href="/">View store ↗</a></header>
<main class="admin-main"><section id="login-view" class="login-wrap"><p class="eyebrow">PRIVATE AREA</p><h1>Admin sign in</h1><p class="muted">Sign in to manage your product and customer orders.</p><form id="login-form" class="form-card"><label>Admin password<input type="password" name="password" required autocomplete="current-password" placeholder="Enter admin password"></label><button class="button button-dark full" type="submit">Sign in</button><p class="form-message" id="login-message" role="status"></p></form></section>
<section id="dashboard-view" hidden><div class="dashboard-heading"><div><p class="eyebrow">STORE MANAGEMENT</p><h1>Dashboard</h1></div><button id="logout" class="button button-light">Log out</button></div>
<div class="dashboard-grid"><section class="panel"><p class="eyebrow">YOUR PRODUCT</p><h2>Edit product</h2><form id="product-form"><label>Product name<input name="name" required maxlength="120"></label><label>Price (PKR)<input name="price" type="number" min="0" step="1" required></label><label>Image URL<input name="image_url" type="url" placeholder="https://..."></label><label>Description<textarea name="description" rows="4"></textarea></label><button class="button button-dark" type="submit">Save product</button><p class="form-message" id="product-message" role="status"></p></form></section>
<section class="panel orders-panel"><div class="orders-heading"><div><p class="eyebrow">CUSTOMER ACTIVITY</p><h2>Orders <span id="order-count" class="count">0</span></h2></div><button id="refresh-orders" class="button button-light">Refresh</button></div><div id="orders-list" class="orders-list"><p class="muted">Loading orders…</p></div></section></div></section></main>
<footer><span>SK Store Admin</span><span>Private dashboard</span></footer><script src="/admin.js"></script></body></html>
