:root{color-scheme:light;--green:#087443;--deep:#064b30;--ink:#14251c;--muted:#68796f;--line:#e4ece6;--paper:#f7faf7;--mint:#e7f4eb}

.hero{max-width:1320px;min-height:590px;padding:76px clamp(20px,5vw,70px) 82px;grid-template-columns:.92fr 1.08fr;gap:clamp(25px,5vw,76px)}
.hero>div:first-child{animation:skRise .75s both}.pill{display:inline-flex;align-items:center;gap:8px;padding:10px 15px;font-size:10px;letter-spacing:1.7px;border:1px solid #d5e9da}

.hero p{font-size:15px;line-height:1.9;max-width:460px;color:#69796f}

.trust{gap:12px 20px;margin-top:30px}.trust span{display:inline-flex;align-items:center;gap:6px}
.hero-art{height:430px;animation:skFade .9s .12s both}.hero-circle{width:min(82%,390px);height:auto;aspect-ratio:1;background:radial-gradient(circle at 35% 35%,#eff9f0,#d5ebdb 72%);box-shadow:inset 0 0 60px #ffffff8a}

.category-section,.shop-section{max-width:1320px;padding-left:clamp(20px,5vw,70px);padding-right:clamp(20px,5vw,70px)}
.section-head{margin-bottom:28px}.eyebrow{letter-spacing:2px}.section-head h2{font-size:clamp(27px,3vw,36px)}
.category-list{gap:12px;padding:5px 2px 15px}.category{padding:12px 19px;border-color:#dfe9e1;transition:all .2s}.category:hover{transform:translateY(-2px);box-shadow:0 7px 16px #08744315}
.shop-section{padding-top:48px;padding-bottom:96px}.search-wrap input{width:min(280px,34vw);padding:13px 16px;border-radius:11px;background:#fff;transition:border .2s,box-shadow .2s}.search-wrap input:focus{border-color:#70ae87;box-shadow:0 0 0 4px #08744312}
.products-grid{grid-template-columns:repeat(4,minmax(0,1fr));gap:22px}.product{border-radius:17px;border-color:#e5ede7;box-shadow:0 5px 20px #193e2608;transition:transform .25s,box-shadow .25s}.product:hover{transform:translateY(-7px);box-shadow:0 18px 38px #193e2617}.product-img{background:#edf4ee}.product-img img{transition:transform .55s}.product:hover .product-img img{transform:scale(1.045)}.product-body{padding:19px}.product h3{font-size:16px;line-height:1.4}.add-button{border-radius:9px;transition:all .2s}.add-button:hover{transform:translateY(-2px)}
.promise{max-width:1180px;margin:0 auto 85px;padding:38px 42px;background:#fff;border:1px solid var(--line);border-radius:22px;display:grid;grid-template-columns:repeat(3,1fr);gap:34px;box-shadow:0 14px 40px #163b2408}.promise>div{padding:5px 10px}.promise>div+div{border-left:1px solid var(--line);padding-left:34px}.promise>div>span{display:inline-grid;place-items:center;width:36px;height:36px;border-radius:50%;background:var(--mint);color:var(--green);font-size:11px;font-weight:800}.promise h3{font:700 17px Manrope,sans-serif;margin:17px 0 8px;color:#183b29}.promise p{font-size:13px;line-height:1.7;color:var(--muted);margin:0}
footer{background:#102e20;color:#d9e9de;padding:52px clamp(22px,7vw,100px) 28px;display:grid;grid-template-columns:1fr auto;align-items:center;gap:12px 30px}footer .brand{color:white}footer .brand span{color:#8fd2a5}footer p{grid-column:1;margin:0;color:#b7cbbd;font-size:13px}footer small{grid-column:1/-1;border-top:1px solid #ffffff20;padding-top:22px;margin-top:18px;color:#a8c0b0;font-size:11px}
.drawer,.modal{backdrop-filter:blur(5px)}.drawer-panel,.modal-card{border-radius:20px;box-shadow:0 25px 80px #071c1270}
@keyframes skRise{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:translateY(0)}}@keyframes skFade{from{opacity:0;transform:translateX(18px)}to{opacity:1;transform:translateX(0)}}
@media(max-width:900px){.hero{min-height:auto;padding-top:54px;grid-template-columns:1fr 1fr;gap:20px}.hero h1{font-size:clamp(40px,6vw,58px);letter-spacing:-2.5px}.hero-art{height:340px}.hero-art img{height:310px}.products-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.promise{margin-left:20px;margin-right:20px}}

@media(prefers-reduced-motion:reduce){*,*:before,*:after{scroll-behavior:auto!important;animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
